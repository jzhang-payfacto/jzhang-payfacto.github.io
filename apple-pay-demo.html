<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Pay Demo</title>

  <style>
      body {
          margin: 0;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          background-color: #f5f5f7;
      }

      .demo-container {
          max-width: 600px;
          margin: 40px auto;
          padding: 24px;
          background-color: #ffffff;
          border-radius: 12px;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      h1 {
          text-align: center;
          font-size: 28px;
      }

      p.support-message {
          text-align: center;
          font-size: 18px;
          color: #515154;
      }

      .payment-frame-container {
          margin-top: 24px;
      }

      iframe.payment-frame {
          width: 100%;
          height: 400px;
          border: 1px solid #d2d2d7;
          border-radius: 8px;
      }
  </style>
</head>

<body>

<div class="demo-container">
  <h1>Apple Pay Jimmy Demo</h1>
  <p class="support-message">Please support and donate</p>
  <p class="support-message">Your contribution helps keep this project going. Thank you!</p>

  <div class="payment-frame-container">
    <iframe class="payment-frame"
            src="https://localhost/apple-pay/apple-pay-web.html"
            title="Apple Pay Payment Page"
            allow="payment"></iframe>
  </div>
</div>

</body>

</html>
