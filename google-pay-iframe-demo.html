<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Pay Iframe Demo</title>

  <style>
      body {
          margin: 0;
          font-family: "Segoe UI", Roboto, -apple-system, Helvetica, Arial, sans-serif;
          background-color: #f5f5f7;
      }

      .demo-container {
          max-width: 600px;
          margin: 40px auto;
          padding: 24px;
          background-color: #ffffff;
          border-radius: 12px;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      h1 {
          text-align: center;
          font-size: 28px;
      }

      p.support-message {
          text-align: center;
          font-size: 18px;
          color: #515154;
      }

      .payment-frame-container {
          margin-top: 24px;
      }

      iframe.payment-frame {
          width: 100%;
          height: 900px;
          border: 1px solid #d2d2d7;
          border-radius: 8px;
      }
  </style>
</head>

<body>

<div class="demo-container">
  <h1>Google Pay Jimmy Demo</h1>
  <p class="support-message">Please support and subscribe</p>
  <p class="support-message">Your contribution helps keep this project going. Thank you!</p>

  <div class="payment-frame-container">
    <!-- allow="payment" delegates Payment Request permission to the cross-origin
         checkout page; without it Google Pay's buyflow is blocked in the frame. -->
    <iframe class="payment-frame"
            src="https://ca.shc.payfacto.cloud/google-pay/google-pay-demo.html"
            title="Google Pay Payment Page"
            allow="payment"></iframe>
  </div>
</div>

</body>

</html>
